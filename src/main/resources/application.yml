spring:
  application:
    name: ecommerce

  datasource:
    url: jdbc:mysql://localhost:3307/ecommerce
    username: study
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jwt:
    secret: test-secret-key-that-is-at-least-32bytes-long-very-strong
    access-token-seconds: 1800
    refresh-token-seconds: 1209600
    cookie:
      access-name: access_token
      refresh-name: refresh_token

springdoc:
  default-produces-media-type: application/json

  swagger-ui:
    csrf:
      enabled: true